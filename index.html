
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Endometriosis Specialist Accessibility Map</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  .map-control {
    background: white;
    padding: 12px;
    border-radius: 5px;
    box-shadow: 0 1px 6px #888;
    font: 13px Arial, sans-serif;
  }

  .map-control label {
    display: block;
    margin: 7px 0;
    cursor: pointer;
  }

  .legend {
    background: white;
    padding: 10px;
    border-radius: 5px;
    font: 12px Arial, sans-serif;
    min-width: 180px;
    box-shadow: 0 1px 6px #888;
  }

  .legend-bar {
    height: 14px;
    margin: 8px 0 5px;
  }

  .legend-labels {
    display: flex;
    justify-content: space-between;
  }

  .status {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: white;
    padding: 10px;
    font: 13px Arial, sans-serif;
  }

  /* City labels */
  .city-label {
    background: rgba(255, 255, 255, 0.88);
    border: none;
    border-radius: 3px;
    box-shadow: none;
    color: #202020;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 4px;
    white-space: nowrap;
    pointer-events: none !important;
  }

  .city-label::before {
    display: none;
  }

  .city-label-major {
    font-size: 12px;
    font-weight: 700;
  }
</style>
</head>




<body>
<div id="map"></div>
<div id="status" class="status">Loading national map...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<script>
const map = L.map("map", {
  preferCanvas: true,
  zoomControl: true
});

map.fitBounds(
  [[24.5, -125], [49.5, -66]],
  {
    padding: [10, 10]
  }
);

// Create a separate pane for provider markers
// so they appear above census tract polygons
map.createPane("providerPane");
map.getPane("providerPane").style.zIndex = 650;

// Add OpenStreetMap basemap
L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }
).addTo(map);

let currentLayer = "SPAR";
let tractLayer;
let providerLayer = L.layerGroup();
let showProviders = true;
let spaiMax = 1;
 
/*************************************************
 * CITY LABELS — ENDOMETRIOSIS SPECIALIST DIRECTORY
 *************************************************/

// Format: [City label, latitude, longitude, minimum zoom]
const cities = [
  // Northeast
  ["New York, NY", 40.7128, -74.0060, 4],
  ["Boston, MA", 42.3601, -71.0589, 4],
  ["Pittsburgh, PA", 40.4406, -79.9959, 4],
  ["Baltimore, MD", 39.2904, -76.6122, 6],
  ["Hartford, CT", 41.7658, -72.6734, 7],
  ["Exeter, NH", 42.9814, -70.9478, 9],
  ["Burlington, MA", 42.5048, -71.1956, 9],
  ["Waltham, MA", 42.3765, -71.2356, 9],
  ["Monroeville, PA", 40.4212, -79.7881, 9],
  ["Newtown Square, PA", 39.9868, -75.4005, 9],
  ["Port Jefferson Station, NY", 40.9254, -73.0473, 9],
  ["Paramus, NJ", 40.9445, -74.0754, 9],
  ["Englewood, NJ", 40.8929, -73.9726, 9],
  ["Voorhees, NJ", 39.8434, -74.9535, 9],
 ["Philadelphia, PA", 39.9526, -75.1636, 4],

  // South and Mid-Atlantic
  ["Atlanta, GA", 33.7490, -84.3880, 4],
  ["Washington, DC", 38.9072, -77.0369, 4],
  ["Dallas, TX", 32.7767, -96.7970, 4],
  ["Miami, FL", 25.7617, -80.1918, 6],
  ["Orlando, FL", 28.5383, -81.3792, 6],
  ["Tampa, FL", 27.9506, -82.4572, 6],
  ["Charlotte, NC", 35.2271, -80.8431, 6],
  ["Lexington, KY", 38.0406, -84.5037, 6],
  ["Charleston, WV", 38.3498, -81.6326, 7],
  ["West Palm Beach, FL", 26.7153, -80.0534, 8],
  ["Martinsburg, WV", 39.4562, -77.9639, 9],
  ["Falls Church, VA", 38.8823, -77.1711, 9],

  // Midwest
  ["St. Louis, MO", 38.6270, -90.1994, 4],
  ["Kansas City, KS", 39.1141, -94.6275, 6],
  ["Cleveland, OH", 41.4993, -81.6944, 6],
  ["Rochester, MN", 44.0121, -92.4802, 7],
  ["Grand Rapids, MI", 42.9634, -85.6681, 7],
  ["Troy, MI", 42.6064, -83.1498, 8],
 ["Detroit, MI", 42.3314, -83.0458, 4],
  ["Maple Grove, MN", 45.0725, -93.4558, 9],
 ["Minneapolis, MN", 44.9778, -93.2650, 4],

  // Mountain
  ["Denver, CO", 39.7392, -104.9903, 4],
  ["Phoenix, AZ", 33.4484, -112.0740, 4],
  ["Post Falls, ID", 47.7179, -116.9516, 7],
  ["Draper, UT", 40.5247, -111.8638, 8],
 ["Salt Lake City, UT", 40.7608, -111.8910, 4],

  // West
  ["Los Angeles, CA", 34.0522, -118.2437, 4],
  ["San Francisco, CA", 37.7749, -122.4194, 4],
  ["Portland, OR", 45.5152, -122.6784, 4],
  ["Gig Harbor, WA", 47.3293, -122.5801, 7],
 ["Seattle, WA", 47.6062, -122.3321, 4],
  ["Palo Alto, CA", 37.4419, -122.1430, 8],
  ["Oakland, CA", 37.8044, -122.2712, 8],
  ["Redwood City, CA", 37.4852, -122.2364, 9],
  ["Los Gatos, CA", 37.2358, -121.9624, 9],
  ["Beverly Hills, CA", 34.0736, -118.4004, 9],
  ["Costa Mesa, CA", 33.6411, -117.9187, 9],
  ["La Jolla, CA", 32.8328, -117.2713, 9],
  ["Los Alamitos, CA", 33.8031, -118.0726, 9],
  ["Playa Vista, CA", 33.9750, -118.4182, 10]
];

// Separate pane keeps city labels above tract polygons
map.createPane("cityLabelPane");
map.getPane("cityLabelPane").style.zIndex = 660;
map.getPane("cityLabelPane").style.pointerEvents = "none";

const cityLayer = L.layerGroup();
let showCities = true;

cities.forEach(function(city) {
  const [name, lat, lon, minZoom] = city;

  const marker = L.marker([lat, lon], {
    icon: L.divIcon({
      className: "",
      html: "",
      iconSize: [1, 1]
    }),
    pane: "cityLabelPane",
    interactive: false
  });

  marker.bindTooltip(name, {
    permanent: true,
    direction: "center",
    offset: [0, 0],
    className: minZoom <= 4
      ? "city-label city-label-major"
      : "city-label"
  });

  marker.minimumZoom = minZoom;
  cityLayer.addLayer(marker);
});

// Show only labels appropriate for the current zoom
function updateCityLabels() {
  const zoom = map.getZoom();

  cityLayer.eachLayer(function(marker) {
    const shouldShow = showCities &&
                       zoom >= marker.minimumZoom;

    if (shouldShow && !map.hasLayer(marker)) {
      marker.addTo(map);
    } else if (!shouldShow && map.hasLayer(marker)) {
      map.removeLayer(marker);
    }
  });
}

map.on("zoomend", updateCityLabels);
updateCityLabels();


function numeric(value) {
  return Number(value);
}

function getColor(value, type) {
  if (value === null || value === undefined ||
      !Number.isFinite(numeric(value))) {
    return "transparent";
  }

  if (type === "SPAR") {
    const scaled = Math.max(0, Math.min(numeric(value), 5)) / 5;
    return d3.interpolateViridis(scaled);
  }

  const scaled = Math.max(0, Math.min(numeric(value) / spaiMax, 1));
  return d3.interpolateMagma(scaled);
}

function tractStyle(feature) {
  const p = feature.properties;

  return {
    stroke: false,
    fill: true,
    fillColor: getColor(p[currentLayer], currentLayer),
    fillOpacity: 0.95,
    interactive: true
  };
}

function formatSPAI(value) {
  if (value == null) return "NA";
  return Number(value).toExponential(3);
}

function tractPopup(feature) {
  const p = feature.properties;

  return `
    <b>FIPS Code:</b> ${p.FIPS}<br>
    <b>SPAR:</b> ${Number(p.SPAR).toFixed(2)}<br>
    <b>SPAI:</b> ${formatSPAI(p.SPAI)}<br>
    <b>Females Ages 10–54:</b>
    ${Number(p.POPULATION).toLocaleString()}
  `;
}

// Layer controls
const layerControl = L.control({position: "topleft"});

layerControl.onAdd = function() {
  const div = L.DomUtil.create("div", "map-control");

  div.innerHTML = `
    <b>Accessibility Measure</b>
    <label><input type="radio" name="measure"
      value="SPAR" checked> SPAR</label>
    <label><input type="radio" name="measure"
      value="SPAI"> SPAI</label>
    <hr>
    <label><input type="checkbox" id="providersToggle"
      checked> Provider locations</label>
      <label>
  <input type="checkbox" id="citiesToggle" checked>
  City labels
</label>
  `;

  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);

  div.querySelectorAll('input[name="measure"]').forEach(input => {
    input.addEventListener("change", function() {
      currentLayer = this.value;

      if (tractLayer) {
        tractLayer.setStyle(tractStyle);
      }

      updateLegend();
    });
  });

  div.querySelector("#providersToggle").addEventListener(
    "change", function() {
      showProviders = this.checked;

      if (showProviders) {
        providerLayer.addTo(map);
      } else {
        map.removeLayer(providerLayer);
      }
    }
  );
div.querySelector("#citiesToggle").addEventListener(
  "change",
  function() {
    showCities = this.checked;
    updateCityLabels();
  }
);
  return div;
};

layerControl.addTo(map);

// Dynamic legend
const legend = L.control({position: "topright"});
let legendDiv;

legend.onAdd = function() {
  legendDiv = L.DomUtil.create("div", "legend");
  updateLegend();
  return legendDiv;
};

legend.addTo(map);

function updateLegend() {
  if (!legendDiv) return;

  const isSPAR = currentLayer === "SPAR";
  const maxValue = isSPAR ? 5 : spaiMax;
  const palette = isSPAR ? d3.interpolateViridis : d3.interpolateMagma;

  const colors = Array.from(
    {length: 101},
    (_, i) => palette(i / 100)
  );

  const gradient = `linear-gradient(to right, ${colors.join(",")})`;

  let labels;

  if (isSPAR) {
    labels = ["0", "1", "2", "3", "4", "5+"];
  } else {
   labels = [0, 0.5, 1].map(
  x => (x * maxValue * 1e5).toFixed(2)
);
  }

  legendDiv.innerHTML = `
    <b>${isSPAR ? "SPAR (5+ capped)" : "SPAI (× 10⁻⁵)"}</b>
    <div class="legend-bar" style="background:${gradient}"></div>
    <div class="legend-labels">
      ${labels.map(x => `<span>${x}</span>`).join("")}
    </div>
  `;
}

// Load national tract data
fetch("tracts.topojson")
  .then(response => {
    if (!response.ok) throw new Error("Cannot load tracts.topojson");
    return response.json();
  })
  .then(topology => {
    const objectName = Object.keys(topology.objects)[0];

    const geojson = topojson.feature(
      topology,
      topology.objects[objectName]
    );

    // Use the full SPAI range, matching the original palette
   spaiMax = geojson.features.reduce(
  (max, feature) => {
    const value = Number(feature.properties.SPAI);
    return Number.isFinite(value)
      ? Math.max(max, value)
      : max;
  },
  0
);

if (spaiMax <= 0) spaiMax = 1;

    tractLayer = L.geoJSON(geojson, {
  renderer: L.canvas({ padding: 0.5 }),
  interactive: true,
  style: tractStyle,

  onEachFeature: function(feature, layer) {
    layer.bindPopup(function() {
      const p = feature.properties;

      return `
        <b>Census Tract:</b> ${p.FIPS}<br>
        <b>SPAR:</b> ${Number(p.SPAR).toFixed(2)}<br>
        <b>SPAI:</b> ${Number(p.SPAI).toExponential(3)}<br>
        <b>Females Ages 10–54:</b>
        ${Number(p.POPULATION).toLocaleString()}
      `;
    });
  }
}).addTo(map);

    updateLegend();

    document.getElementById("status").style.display = "none";
  })
  .catch(error => {
    document.getElementById("status").textContent =
      "Error loading tract data: " + error.message;
    console.error(error);
  });


// Load actual geocoded provider locations
fetch("providers.geojson")
  .then(response => {
    if (!response.ok) {
      throw new Error("Cannot load providers.geojson");
    }
    return response.json();
  })
  .then(geojson => {

    providerLayer = L.geoJSON(geojson, {

      pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
  radius: 6,
  color: "#08306b",
  fillColor: "#2171b5",
  weight: 1.5,
  opacity: 1,
  fillOpacity: 1,
  pane: "providerPane"
});
      },

      onEachFeature: function(feature, layer) {
  layer.bindPopup(`
    <b>Endometriosis Excision Specialist</b>
  `);
}

    });

    if (showProviders) {
      providerLayer.addTo(map);
    }

    console.log(
      "Actual provider locations loaded:",
      geojson.features.length
    );

  })
  .catch(error => {
    console.error(
      "Error loading provider locations:",
      error
    );
  });

</script>
</body>
</html>
